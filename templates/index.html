<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Base Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Knowledge Base Editor</h1>
    <p>Локальное управление статьями для MkDocs/GitHub Pages</p>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="panel-head">
        <h2>Структура</h2>
        <button id="refreshTreeBtn" type="button">Обновить</button>
      </div>
      <div id="tree" class="tree"></div>
    </aside>

    <section class="panel editor-panel">
      <div class="editor-top">
        <label for="articlePath">Путь статьи (например: <code>Java/Collections/List</code>)</label>
        <input id="articlePath" type="text" placeholder="Java/Collections/List.md">
      </div>

      <textarea id="articleContent" placeholder="# Заголовок&#10;&#10;Текст статьи"></textarea>

      <div class="actions">
        <button id="createBtn" type="button">Создать статью</button>
        <button id="saveBtn" type="button">Сохранить изменения</button>
        <button id="deleteBtn" type="button" class="danger">Удалить статью</button>
        <button id="createFolderBtn" type="button">Создать папку</button>
        <button id="deleteFolderBtn" type="button" class="danger">Удалить папку</button>
      </div>

      <p class="hint">
        Для публикации в GitHub Pages: зафиксируй изменения через git и отправь в репозиторий.
      </p>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
